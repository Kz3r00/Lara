<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lugar Seguro - Tela Principal</title>
    <link rel="stylesheet" href="estilo-global.css">
    <style>
        /* Estilos específicos APENAS para a tela principal (posicionamento absoluto dos botões) */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e74c3c 0%, #3b5998 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
            padding: 20px;
        }

        .container-principal {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            min-height: 500px;
            margin: 0 auto;
        }

        .btn-canto {
            position: absolute;
            padding: 12px 20px;
            border: none;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            text-align: center;
            min-width: 140px;
            font-family: inherit;
            color: #2c3e50;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-canto:active {
            transform: scale(0.96);
        }

        .top-left {
            top: 20px;
            left: 20px;
        }
        .top-right {
            top: 20px;
            right: 20px;
        }
        .bottom-left {
            bottom: 20px;
            left: 20px;
        }
        .bottom-right {
            bottom: 20px;
            right: 20px;
        }

        .btn-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 28px;
            font-size: 1.1rem;
            min-width: 180px;
            background: #ffd966;
            color: #2c3e50;
            cursor: pointer;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-central:active {
            transform: translate(-50%, -50%) scale(0.96);
        }

        .btn-central:hover {
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 480px) {
            .btn-canto {
                padding: 8px 12px;
                font-size: 0.7rem;
                min-width: 100px;
            }
            .container-principal {
                height: 70vh;
                min-height: 450px;
            }
            .btn-central {
                padding: 12px 20px;
                font-size: 0.9rem;
                min-width: 150px;
            }
        }

        @media (max-width: 380px) {
            .btn-canto {
                padding: 6px 8px;
                font-size: 0.6rem;
                min-width: 85px;
            }
        }

        .assinatura {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,240,0.7);
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container-principal">
    <!-- Botões dos cantos - 4 páginas -->
    <a href="mensagem.html" class="btn-canto top-left">✨ Mensagem do dia</a>
    <a href="jogos.html" class="btn-canto top-right">🎲 Sala de Jogos</a>
    <a href="historias.html" class="btn-canto bottom-left">📖 Nossas Histórias</a>
    <a href="missao.html" class="btn-canto bottom-right">🎯 Missão do Dia</a>

    <!-- Botão central SEMPRE ATIVO -->
    <a href="surpresa.html" class="btn-central">💝 Surpresa especial 💝</a>
</div>
<div class="assinatura">Lugar Seguro — só para nós dois</div>

</body>
</html>
