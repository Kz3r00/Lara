<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>💕 Surpresa Especial</title>
    <style>
        /* ============================================================
           ESTILOS GERAIS
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background: #0a0a1a;
            transition: background 0.8s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-height: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 35px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pergunta-container {
            animation: slideUp 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .pergunta-numero {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .pergunta-titulo {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 15px;
            font-style: italic;
        }

        .pergunta-texto {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Opções */
        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .opcao-btn {
            padding: 14px 20px;
            border: 2px solid #ddd;
            border-radius: 16px;
            background: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
            color: #2c3e50;
        }

        .opcao-btn:hover {
            border-color: #9b59b6;
            background: #f8f0ff;
        }

        .opcao-btn:active {
            transform: scale(0.97);
        }

        .opcao-btn.certa {
            border-color: #27ae60;
            background: #eafaf1;
            color: #27ae60;
        }

        .opcao-btn.errada {
            border-color: #e74c3c;
            background: #fdedec;
            color: #e74c3c;
        }

        .opcao-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Campo aberto */
        .campo-aberto {
            margin: 20px 0;
        }

        .campo-aberto textarea {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #ddd;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            transition: border 0.3s;
        }

        .campo-aberto textarea:focus {
            border-color: #9b59b6;
            outline: none;
        }

        .btn-enviar {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            background: #9b59b6;
            color: white;
        }

        .btn-enviar:hover {
            background: #8e44ad;
            transform: scale(1.02);
        }

        .btn-enviar:active {
            transform: scale(0.96);
        }

        /* Mensagem de resultado */
        .mensagem-resultado {
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            background: #f8f0ff;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #2c3e50;
            animation: slideUp 0.4s ease;
            border-left: 4px solid #9b59b6;
        }

        .mensagem-resultado .destaque {
            color: #9b59b6;
            font-weight: bold;
        }

        /* Botão próximo */
        .btn-proximo {
            display: none;
            margin-top: 20px;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-proximo:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4);
        }

        .btn-proximo:active {
            transform: scale(0.96);
        }

        .btn-proximo.visible {
            display: inline-block;
            animation: slideUp 0.4s ease;
        }

        /* Tela de suspense */
        .tela-suspense {
            text-align: center;
            padding: 40px 20px;
            animation: slideUp 0.8s ease;
        }

        .tela-suspense h2 {
            font-size: 2rem;
            color: #6c3483;
            margin-bottom: 20px;
        }

        .tela-suspense p {
            font-size: 1.2rem;
            color: #4a235a;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .tela-suspense .btn-suspense {
            padding: 16px 40px;
            border: none;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #6c3483, #4a235a);
            color: white;
            transition: all 0.3s ease;
        }

        .tela-suspense .btn-suspense:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(108, 52, 131, 0.5);
        }

        /* Tela final - Pedido */
        .tela-pedido {
            text-align: center;
            padding: 30px 20px;
            animation: slideUp 0.6s ease;
        }

        .tela-pedido h2 {
            font-size: 1.8rem;
            color: #c0392b;
            margin-bottom: 20px;
        }

        .tela-pedido p {
            font-size: 1.1rem;
            color: #2c3e50;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .botoes-pedido {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-pedido {
            padding: 16px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-pedido-sim {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-pedido-sim:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(231, 76, 60, 0.5);
        }

        .btn-pedido-claro {
            background: linear-gradient(135deg, #e91e63, #ad1457);
            color: white;
        }

        .btn-pedido-claro:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(233, 30, 99, 0.5);
        }

        .tela-final {
            text-align: center;
            padding: 40px 20px;
            animation: slideUp 0.6s ease;
        }

        .tela-final h1 {
            font-size: 2.5rem;
            color: #c0392b;
            margin-bottom: 15px;
        }

        .tela-final p {
            font-size: 1.3rem;
            color: #2c3e50;
            line-height: 1.8;
        }

        /* Efeitos de fundo */
        .bg-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-effect .particle {
            position: absolute;
            opacity: 0.2;
            font-size: 1.5rem;
            animation: floatParticle 8s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100%) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-100%) rotate(720deg); opacity: 0; }
        }

        /* Corações flutuantes */
        .heart-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .heart-rain .heart {
            position: absolute;
            font-size: 2rem;
            animation: heartFall linear forwards;
            color: #e74c3c;
        }

        @keyframes heartFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Confetes */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .hidden {
            display: none !important;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
                min-height: 400px;
            }
            .pergunta-texto {
                font-size: 1.1rem;
            }
            .opcao-btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            .tela-pedido h2 {
                font-size: 1.4rem;
            }
            .btn-pedido {
                padding: 14px 30px;
                font-size: 1rem;
            }
            .tela-suspense h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

    function criarEfeito(efeito) {

    function chuvaDeCoracoes() {
        const container = document.getElementById('heartRain');
        const hearts = ['❤️','💕','💗','💖','💘','♥️'];
        for (let i = 0; i < 60; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (1 + Math.random() * 2.5) + 'rem';
                heart.style.animationDuration = (2 + Math.random() * 3) + 's';
                heart.style.animationDelay = '0s';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, i * 80);
        }
    }

    function confetes() {
        const container = document.getElementById('confettiContainer');
        const cores = ['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#e91e63','#ff6f00','#00bcd4'];
        for (let i = 0; i < 100; i++) {
            setTimeout(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.width = (5 + Math.random() * 10) + 'px';
                confetti.style.height = (5 + Math.random() * 10) + 'px';
                confetti.style.background = cores[Math.floor(Math.random() * cores.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
                confetti.style.animationDelay = '0s';
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }, i * 50);
        }
    }

    // ============================================================
    // RENDERIZAÇÃO
    // ============================================================

    function renderizarPergunta(index) {
        const p = perguntas[index];
        const container = document.getElementById('container');
        const conteudo = document.getElementById('conteudo');

        // Atualizar fundo
        document.body.style.background = p.corFundo;

        // Criar efeito
        criarEfeito(p.efeito);

        let html = `<div class="pergunta-container">`;
        html += `<div class="pergunta-numero">Pergunta ${p.id} de ${perguntas.length}</div>`;
        html += `<div class="pergunta-titulo">${p.titulo}</div>`;
        html += `<div class="pergunta-texto">${p.pergunta}</div>`;

        if (p.tipo === 'opcoes') {
            html += `<div class="opcoes" id="opcoes">`;
            p.opcoes.forEach((opcao, i) => {
                html += `<button class="opcao-btn" data-index="${i}" data-opcao="${opcao}">${opcao}</button>`;
            });
            html += `</div>`;
            html += `<div id="resultado"></div>`;
            html += `<button class="btn-proximo" id="btnProximo">Próxima pergunta ➜</button>`;
        } else {
            html += `<div class="campo-aberto">`;
            html += `<textarea id="respostaAberta" placeholder="Digite sua resposta aqui..."></textarea>`;
            html += `<button class="btn-enviar" id="btnEnviarAberta">💕 Enviar resposta</button>`;
            html += `</div>`;
            html += `<div id="resultado"></div>`;
            html += `<button class="btn-proximo" id="btnProximo">Próxima pergunta ➜</button>`;
        }

        html += `</div>`;
        conteudo.innerHTML = html;

        // Eventos
        if (p.tipo === 'opcoes') {
            const botoes = document.querySelectorAll('.opcao-btn');
            const btnProximo = document.getElementById('btnProximo');

            botoes.forEach(btn => {
                btn.addEventListener('click', function() {
                    if (this.disabled) return;
                    const opcao = this.getAttribute('data-opcao');
                    const resultadoDiv = document.getElementById('resultado');
                    
                    botoes.forEach(b => b.disabled = true);

                    let acertou = false;
                    if (p.respostaCorreta === 'nenhuma') {
                        // Sempre erra
                        this.classList.add('errada');
                        resultadoDiv.innerHTML = `<div class="mensagem-resultado">${p.mensagem}</div>`;
                    } else if (opcao === p.respostaCorreta) {
                        this.classList.add('certa');
                        acertou = true;
                        resultadoDiv.innerHTML = `<div class="mensagem-resultado">${p.mensagem}</div>`;
                    } else {
                        this.classList.add('errada');
                        // Mostrar qual era a certa
                        botoes.forEach(b => {
                            if (b.getAttribute('data-opcao') === p.respostaCorreta) {
                                b.classList.add('certa');
                            }
                        });
                        resultadoDiv.innerHTML = `<div class="mensagem-resultado">${p.mensagem}</div>`;
                    }

                    btnProximo.classList.add('visible');
                });
            });

            btnProximo.addEventListener('click', function() {
                if (index < perguntas.length - 1) {
                    perguntaAtual++;
                    renderizarPergunta(perguntaAtual);
                } else {
                    mostrarSuspense();
                }
            });
        } else {
            // Tipo aberta
            const btnEnviar = document.getElementById('btnEnviarAberta');
            const textarea = document.getElementById('respostaAberta');
            const resultadoDiv = document.getElementById('resultado');
            const btnProximo = document.getElementById('btnProximo');

            btnEnviar.addEventListener('click', function() {
                const resposta = textarea.value.trim();
                if (!resposta) {
                    alert('💕 Escreva sua resposta primeiro!');
                    return;
                }

                respostas.push(resposta);
                resultadoDiv.innerHTML = `<div class="mensagem-resultado">${p.mensagem}</div>`;
                textarea.disabled = true;
                btnEnviar.disabled = true;
                btnProximo.classList.add('visible');
            });

            btnProximo.addEventListener('click', function() {
                if (index < perguntas.length - 1) {
                    perguntaAtual++;
                    renderizarPergunta(perguntaAtual);
                } else {
                    mostrarSuspense();
                }
            });
        }
    }
